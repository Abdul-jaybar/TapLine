<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030816">
<title>TapLine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"></span><span>TapLine</span></div>
  <button id="gameBtn" class="game-btn glass" aria-haspopup="dialog"><span class="live"></span><span id="gameTitle">Loading live games…</span><span class="caret">▾</span></button>
  <div class="spacer"></div>
  <div class="wallet glass"><span class="mode" id="mode">PAPER</span><span id="balance">$0.00</span><span class="delta" id="delta"></span></div>
</header>

<nav class="markets" id="markets" aria-label="Markets"></nav>
<div class="contracts" id="contracts" aria-label="Contracts"></div>

<main class="stage">
  <canvas id="grid" aria-label="Live odds grid. Tap a box to trade."></canvas>
  <div class="empty" id="empty">Loading live games from Gemini…</div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</main>

<footer class="controls">
  <div class="group" role="group" aria-label="Amount per tap">
    <span class="lbl">Per tap</span>
    <div id="stakes" class="seg glass"></div>
  </div>
  <div class="group" role="group" aria-label="Time per column">
    <span class="lbl">Column</span>
    <div id="cols" class="seg glass"></div>
  </div>
  <button id="soundBtn" class="icon-btn glass" aria-label="Sound" aria-pressed="true">♪</button>
  <button id="posBtn" class="pos-btn glass">Positions <span id="posCount">0</span></button>
</footer>

<dialog id="gameDlg" class="sheet">
  <div class="sheet-head"><h2>Live games</h2><button class="x" data-close aria-label="Close">×</button></div>
  <div id="gameList" class="list"></div>
</dialog>

<dialog id="posDlg" class="sheet">
  <div class="sheet-head"><h2>Positions</h2><button class="x" data-close aria-label="Close">×</button></div>
  <div id="posList" class="list"></div>
</dialog>

<script type="module" src="/app.js"></script>
</body>
</html>
